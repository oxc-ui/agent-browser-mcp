# agent-browser-mcp Docker stack
# No nginx — cloudflared tunnels HTTP directly to the mcp-proxy port.
# Auth is handled by Cloudflare Access (configured in dashboard once).
#
# Usage:
#   docker compose up -d
#   docker compose logs -f
#
# Environment variables (set via .env or docker run -e):
#   CF_TUNNEL_TOKEN    Cloudflare tunnel connector token (from one.dash.cloudflare.com)
#   OPENAI_API_KEY     Optional — only needed for browser_task agent tool
#   OPENAI_API_BASE    Optional — LLM endpoint override (default: OpenAI)
#   MCP_PORT           Internal port (default 8080)
services:
  mcp:
    build:
      context: .
      dockerfile: Dockerfile.mcp
    container_name: agent-browser-mcp
    restart: unless-stopped
    # Publish on a fixed host port 8080. The tunnel container runs on
    # host network and dials localhost:8080 (per the Cloudflare ingress
    # rule). The previous rotating host port (8001-8004) is no longer
    # needed since concurrent runs are mutually exclusive: a new run
    # starts only after the previous run's keep-alive exits cleanly.
    ports:
      - "8080:8080"
    environment:
      BROWSER_USE_HEADLESS: "true"
      ANONYMIZED_TELEMETRY: "false"
      BROWSER_USE_CLOUD_SYNC: "false"
      BROWSER_USE_LOGGING_LEVEL: "info"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      OPENAI_API_BASE: "${OPENAI_API_BASE:-}"
      # Custom provider (PXO/indevs proxy) requires this exact model:
      BROWSER_USE_MODEL: "openrouter/openrouter/free"
      MCP_PORT: "8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz').read()"]
      interval: 30s
      timeout: 5s
      retries: 3

  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: agent-browser-tunnel
    restart: unless-stopped
    # Host network: cloudflared's "localhost:8080" (configured in Cloudflare
    # ingress) is then the host's localhost:8080, which is the port the
    # mcp container publishes to. Without this, cloudflared inside the
    # container would dial its own loopback (empty).
    network_mode: host
    depends_on:
      mcp:
        condition: service_healthy
    command:
      - tunnel
      - --no-autoupdate
      - run
    environment:
      TUNNEL_TRANSPORT_LOGLEVEL: info
      TUNNEL_TOKEN: ${CF_TUNNEL_TOKEN:?CF_TUNNEL_TOKEN must be set}
