name: browser-mcp

on:
  workflow_dispatch: {}
  schedule:
    # every 5 hours — each run lives ~5h50m so the next run overlaps
    # the previous one by ~50 min (seamless handoff, no downtime)
    - cron: '0 */5 * * *'

# NOTE: no concurrency group on purpose — overlapping runs are the
# handoff mechanism. Port rotation (below) prevents collisions.

# Need write permission so the 'Publish current endpoint' step can push
# the live URL back to this repo (default GITHUB_TOKEN is read-only on
# the triggering branch).
permissions:
  contents: write

jobs:
  serve:
    runs-on: ubuntu-latest
    # 5h50m — just under the 6h free-tier cap, 50m longer than the 5h
    # schedule interval so there is always overlap
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          # fetch full history so we can publish to the live README later
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install browser-use MCP + mcp-proxy
        run: |
          # mcp-proxy 0.12.x breaks against mcp>=2.0 (request_ctx removed) — pin mcp<2
          uv tool install 'mcp-proxy' --with 'mcp<2'
          uv tool install 'browser-use[cli]'
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          # warm the uv cache so the stdio server starts fast later
          uvx --from 'browser-use[cli]' browser-use --version || true

      - name: Install cloudflared
        run: |
          curl -sL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 \
            -o /usr/local/bin/cloudflared
          chmod +x /usr/local/bin/cloudflared
          cloudflared --version

      - name: Chrome /dev/shm fix
        run: sudo mount -t tmpfs -o size=2g tmpfs /dev/shm

      - name: Compute rotated port
        id: port
        run: |
          # run 1->8002, 2->8003, 3->8004, 4->8001, 5->8002 ...
          # consecutive runs ALWAYS land on different ports, cycle of 4
          PORT=$(( 8001 + ( ${{ github.run_number }} % 4 ) ))
          echo "port=$PORT" >> "$GITHUB_OUTPUT"
          echo "run_number=${{ github.run_number }} -> port $PORT"

      - name: Render nginx config
        run: |
          mkdir -p /tmp/abmcp-logs
          export MCP_AUTH_TOKEN="${{ secrets.MCP_AUTH_TOKEN }}"
          export MCP_PORT="${{ steps.port.outputs.port }}"
          envsubst '${MCP_AUTH_TOKEN} ${MCP_PORT}' \
            < deploy/nginx.conf.template > /tmp/nginx.conf
          sudo nginx -t -c /tmp/nginx.conf

      - name: Start MCP server + nginx + quick tunnel
        env:
          MCP_AUTH_TOKEN: ${{ secrets.MCP_AUTH_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_API_BASE: ${{ secrets.OPENAI_API_BASE }}
          MCP_PORT: ${{ steps.port.outputs.port }}
        run: bash deploy/start.sh

      - name: Read published tunnel URL
        id: tunnel
        run: |
          # start.sh wrote /tmp/abmcp-logs/tunnel_url.txt after the tunnel came up
          if [ ! -f /tmp/abmcp-logs/tunnel_url.txt ]; then
            echo "::error::tunnel_url.txt missing — cloudflared never registered a hostname"
            tail -40 /tmp/abmcp-logs/cloudflared.log || true
            exit 1
          fi
          URL=$(tr -d '[:space:]' < /tmp/abmcp-logs/tunnel_url.txt)
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "current tunnel: $URL"

      - name: Health check (local + through tunnel)
        # Tunnel may need a few seconds to fully propagate even after
        # cloudflared prints the URL — don't fail the run if it isn't
        # reachable yet; the keep-alive loop will keep retrying.
        continue-on-error: true
        env:
          MCP_AUTH_TOKEN: ${{ secrets.MCP_AUTH_TOKEN }}
          MCP_PORT: ${{ steps.port.outputs.port }}
          TUNNEL_URL: ${{ steps.tunnel.outputs.url }}
        run: |
          echo "--- local nginx /healthz ---"
          curl -sf --max-time 10 http://127.0.0.1/healthz && echo " OK"

          echo "--- local MCP initialize ---"
          code=$(curl -s -o /tmp/local_init.txt -w '%{http_code}' --max-time 60 \
            -X POST "http://127.0.0.1:${MCP_PORT:-8001}/mcp" \
            -H 'Content-Type: application/json' \
            -H 'Accept: application/json, text/event-stream' \
            -d '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-03-26","capabilities":{},"clientInfo":{"name":"healthcheck","version":"1.0"}}}')
          echo "local mcp-proxy: HTTP $code"
          head -c 300 /tmp/local_init.txt; echo

          echo "--- through Cloudflare quick-tunnel: $TUNNEL_URL ---"
          for i in $(seq 1 15); do
            code=$(curl -s -o /tmp/tunnel_init.txt -w '%{http_code}' --max-time 30 \
              -X POST "$TUNNEL_URL/mcp" \
              -H "Authorization: Bearer ${MCP_AUTH_TOKEN}" \
              -H 'Content-Type: application/json' \
              -H 'Accept: application/json, text/event-stream' \
              -d '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-03-26","capabilities":{},"clientInfo":{"name":"healthcheck","version":"1.0"}}}')
            echo "attempt $i: HTTP $code"
            if [ "$code" = "200" ]; then
              head -c 300 /tmp/tunnel_init.txt; echo
              echo "TUNNEL HEALTHY"
              exit 0
            fi
            sleep 15
          done
          echo "::warning::Tunnel probe did not return 200 within 225s — keep-alive will keep retrying"
          tail -c 500 /tmp/tunnel_init.txt
          # do NOT exit 1 — keep-alive must run regardless

      - name: Publish current endpoint to repo
        # Never block the keep-alive supervisor on a publish hiccup — the
        # tunnel itself stays up regardless.
        continue-on-error: true
        env:
          TUNNEL_URL: ${{ steps.tunnel.outputs.url }}
          MCP_AUTH_TOKEN: ${{ secrets.MCP_AUTH_TOKEN }}
          RUN_NUMBER: ${{ github.run_number }}
          API: ${{ github.api_url }}
          REPO: ${{ github.repository }}
        run: |
          # disable -e so we can log every step's outcome before exiting
          set +e

          NOW_UTC=$(date -u +"%Y-%m-%d %H:%M:%S UTC")
          echo "[publish] TUNNEL_URL=${TUNNEL_URL}"
          echo "[publish] RUN_NUMBER=${RUN_NUMBER}"
          echo "[publish] repo=${REPO}"

          cat > endpoint.json <<EOF
          {
            "url": "${TUNNEL_URL}",
            "mcp_endpoint": "${TUNNEL_URL}/mcp",
            "auth_header": "Authorization: Bearer \${MCP_AUTH_TOKEN}",
            "run_number": ${RUN_NUMBER},
            "updated_utc": "${NOW_UTC}",
            "note": "This URL changes every ~5h on quick-tunnel rotation."
          }
          EOF

          # Mirror endpoint.json to a workflow-owned 'endpoint' orphan branch
          # via the Contents API — avoids races with the workflow's own
          # main-branch checkout. Discovery URL:
          #   https://raw.githubusercontent.com/oxc-ui/agent-browser-mcp/endpoint/endpoint.json
          CONTENT_B64=$(base64 -w0 < endpoint.json)

          EXISTING_FILE_SHA=""
          EXISTING=$(curl -s -o /tmp/existing.json -w '%{http_code}' \
            -H "Authorization: token ${GITHUB_TOKEN}" \
            "${API}/repos/${REPO}/contents/endpoint.json?ref=endpoint")
          echo "[publish] endpoint-branch probe HTTP ${EXISTING}"

          if [ "${EXISTING}" = "200" ]; then
            EXISTING_FILE_SHA=$(python3 -c "import json; print(json.load(open('/tmp/existing.json'))['sha'])" 2>/dev/null || echo "")
            echo "[publish] updating existing endpoint.json (sha=${EXISTING_FILE_SHA})"
          else
            echo "[publish] creating 'endpoint' branch"
            curl -s -o /tmp/main_sha.json \
              -H "Authorization: token ${GITHUB_TOKEN}" \
              "${API}/repos/${REPO}/git/ref/heads/main"
            MAIN_SHA=$(python3 -c "
          import json
          try:
              d = json.load(open('/tmp/main_sha.json'))
              print(d.get('object',{}).get('sha',''))
          except Exception as e:
              print('')
          " 2>/dev/null)
            echo "[publish] main HEAD sha=${MAIN_SHA}"

            if [ -z "${MAIN_SHA}" ]; then
              echo "[publish] ::warning::could not resolve main HEAD — skipping publish"
              cat endpoint.json
              exit 0
            fi

            HTTP=$(curl -s -o /tmp/ref.json -w '%{http_code}' -X POST \
              -H "Authorization: token ${GITHUB_TOKEN}" \
              -H "Content-Type: application/json" \
              "${API}/repos/${REPO}/git/refs" \
              -d "{\"ref\":\"refs/heads/endpoint\",\"sha\":\"${MAIN_SHA}\"}")
            echo "[publish] POST ref -> HTTP ${HTTP}"
            # 422 = already exists (race with another runner or a prior run) — fine, fall through
            # After branch exists, endpoint.json may or may not exist on it yet
            PROBE2=$(curl -s -o /tmp/existing.json -w '%{http_code}' \
              -H "Authorization: token ${GITHUB_TOKEN}" \
              "${API}/repos/${REPO}/contents/endpoint.json?ref=endpoint")
            echo "[publish] post-create endpoint.json probe HTTP ${PROBE2}"
            if [ "${PROBE2}" = "200" ]; then
              EXISTING_FILE_SHA=$(python3 -c "import json; print(json.load(open('/tmp/existing.json'))['sha'])" 2>/dev/null || echo "")
              echo "[publish] existing endpoint.json sha=${EXISTING_FILE_SHA}"
            fi
          fi

          # Build the PUT body — sha is REQUIRED if the file already exists
          if [ -n "${EXISTING_FILE_SHA}" ]; then
            PUT_DATA=$(python3 -c "
          import json
          print(json.dumps({
            'message': 'publish endpoint (run ${RUN_NUMBER}): ${TUNNEL_URL}',
            'branch': 'endpoint',
            'sha': '${EXISTING_FILE_SHA}',
            'content': '${CONTENT_B64}',
          }))")
          else
            PUT_DATA=$(python3 -c "
          import json
          print(json.dumps({
            'message': 'publish endpoint (run ${RUN_NUMBER}): ${TUNNEL_URL}',
            'branch': 'endpoint',
            'content': '${CONTENT_B64}',
          }))")
          fi

          HTTP=$(curl -s -o /tmp/put.json -w '%{http_code}' -X PUT \
            -H "Authorization: token ${GITHUB_TOKEN}" \
            -H "Content-Type: application/json" \
            "${API}/repos/${REPO}/contents/endpoint.json" \
            -d "${PUT_DATA}")
          echo "[publish] PUT endpoint.json -> HTTP ${HTTP}"
          if [ "${HTTP}" != "200" ] && [ "${HTTP}" != "201" ]; then
            echo "[publish] PUT FAILED:"
            cat /tmp/put.json
          fi

          echo "[publish] DONE — endpoint.json contents:"
          cat endpoint.json

      - name: Keep alive (supervisor, ~5h45m)
        env:
          MCP_AUTH_TOKEN: ${{ secrets.MCP_AUTH_TOKEN }}
          MCP_PORT: ${{ steps.port.outputs.port }}
          TUNNEL_URL_FILE: /tmp/abmcp-logs/tunnel_url.txt
        run: |
          # 345 one-minute ticks; every tick verify the three processes,
          # restart any that died; every 5th tick probe through the tunnel
          for i in $(seq 1 345); do
            sleep 60

            for svc in mcp-proxy nginx cloudflared; do
              if ! pgrep -f "$svc" > /dev/null; then
                echo "[tick $i] $svc died — restarting"
                case $svc in
                  mcp-proxy)
                    nohup "$HOME/.local/bin/mcp-proxy" --host 127.0.0.1 \
                      --port "$MCP_PORT" --stateless -- \
                      uvx --from 'browser-use[cli]' browser-use --mcp \
                      >> /tmp/abmcp-logs/mcp-proxy.log 2>&1 &
                    ;;
                  nginx) sudo nginx -c /tmp/nginx.conf ;;
                  cloudflared)
                    # quick-tunnel mode: no token, hostname goes to stdout
                    nohup cloudflared tunnel --no-autoupdate --url http://localhost \
                      >> /tmp/abmcp-logs/cloudflared.log 2>&1 &
                    ;;
                esac
              fi
            done

            if [ $(( i % 5 )) -eq 0 ]; then
              code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 \
                http://127.0.0.1/healthz)
              echo "[tick $i] local healthz: $code"
            fi
          done
          echo "shift complete — next runner should already be serving"

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-mcp-logs-run-${{ github.run_number }}
          path: /tmp/abmcp-logs/
          if-no-files-found: ignore
