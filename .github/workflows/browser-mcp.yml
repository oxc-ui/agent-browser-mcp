name: browser-mcp

on:
  workflow_dispatch: {}
  schedule:
    # every 5 hours — each run lives ~5h50m so the next run overlaps
    # the previous one by ~50 min (seamless handoff, no downtime)
    - cron: '0 */5 * * *'

# NOTE: no concurrency group on purpose — overlapping runs are the
# handoff mechanism. Port rotation (below) prevents collisions.

permissions:
  contents: write

jobs:
  serve:
    runs-on: ubuntu-latest
    # 5h50m — just under the 6h free-tier cap, 50m longer than the 5h
    # schedule interval so there is always overlap
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - name: Compute rotated host port
        id: port
        run: |
          # run 1->8002, 2->8003, 3->8004, 4->8001, 5->8002 ...
          # consecutive runs ALWAYS land on different host-mapped ports,
          # so overlapping runners don't collide.
          PORT=$(( 8001 + ( ${{ github.run_number }} % 4 ) ))
          echo "port=$PORT" >> "$GITHUB_OUTPUT"
          echo "run_number=${{ github.run_number }} -> host port $PORT"

      - name: Bring up the Docker stack
        env:
          CF_TUNNEL_TOKEN: ${{ secrets.CF_TUNNEL_TOKEN }}
          MCP_AUTH_TOKEN: ${{ secrets.MCP_AUTH_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_API_BASE: ${{ secrets.OPENAI_API_BASE }}
          MCP_PORT: ${{ steps.port.outputs.port }}
        run: |
          # Don't use set -e here — we want diagnostic output even on failure
          set +e

          mkdir -p /tmp/abmcp-logs

          # Write the compose env file
          cat > .env <<EOF
          CF_TUNNEL_TOKEN=${CF_TUNNEL_TOKEN}
          MCP_AUTH_TOKEN=${MCP_AUTH_TOKEN}
          OPENAI_API_KEY=${OPENAI_API_KEY}
          OPENAI_API_BASE=${OPENAI_API_BASE}
          MCP_PORT=${MCP_PORT}
          EOF

          # Build + start
          echo "=== docker compose build ==="
          docker compose build --pull 2>&1 | tail -30
          echo "=== docker compose up ==="
          docker compose up -d 2>&1 | tail -30

          # Wait for the MCP container to be healthy
          echo "Waiting for agent-browser-mcp to be healthy..."
          STATUS=""
          for i in $(seq 1 60); do
            STATUS=$(docker inspect --format='{{.State.Health.Status}}' agent-browser-mcp 2>/dev/null)
            [ -z "$STATUS" ] && STATUS="(no container yet)"
            echo "  [$i] health=${STATUS}"
            if [ "$STATUS" = "healthy" ]; then
              break
            fi
            sleep 2
          done

          # Always capture initial logs for debugging, even on success
          docker compose logs --no-color > /tmp/abmcp-logs/compose-init.log 2>&1

          if [ "$STATUS" != "healthy" ]; then
            echo "::error::agent-browser-mcp did not become healthy"
            echo "=== docker compose ps ==="
            docker compose ps
            exit 1
          fi

          echo "MCP_HOST_PORT=${MCP_PORT}" >> "$GITHUB_ENV"

      - name: Health check (local + through tunnel)
        env:
          MCP_AUTH_TOKEN: ${{ secrets.MCP_AUTH_TOKEN }}
          TUNNEL_URL: https://agent-browser.oxu.indevs.in
        run: |
          echo "--- local /healthz (host port ${MCP_HOST_PORT}) ---"
          curl -sf --max-time 10 "http://127.0.0.1:${MCP_HOST_PORT}/healthz" && echo " OK"

          echo "--- local MCP initialize ---"
          code=$(curl -s -o /tmp/local_init.txt -w '%{http_code}' --max-time 60 \
            -X POST "http://127.0.0.1:${MCP_HOST_PORT}/mcp" \
            -H "Authorization: Bearer ${MCP_AUTH_TOKEN}" \
            -H 'Content-Type: application/json' \
            -H 'Accept: application/json, text/event-stream' \
            -d '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-03-26","capabilities":{},"clientInfo":{"name":"healthcheck","version":"1.0"}}}')
          echo "local MCP: HTTP $code"
          head -c 300 /tmp/local_init.txt; echo

          # Network reachability: can the tunnel container reach the mcp container?
          echo "--- network reachability ---"
          docker compose exec -T tunnel sh -c 'wget -qO- http://mcp:8080/healthz 2>&1 || echo "wget failed"' 2>&1 | head -5
          docker compose exec -T tunnel sh -c 'getent hosts mcp 2>&1' 2>&1 | head -5

          # Capture tunnel container's view of the mcp container
          echo "--- tunnel container logs (last 20 lines) ---"
          docker compose logs --no-color tunnel 2>&1 | tail -20

          echo "--- through Cloudflare tunnel: ${TUNNEL_URL} ---"
          for i in $(seq 1 15); do
            code=$(curl -s -o /tmp/tunnel_init.txt -w '%{http_code}' --max-time 30 \
              -X POST "${TUNNEL_URL}/mcp" \
              -H "Authorization: Bearer ${MCP_AUTH_TOKEN}" \
              -H 'Content-Type: application/json' \
              -H 'Accept: application/json, text/event-stream' \
              -d '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-03-26","capabilities":{},"clientInfo":{"name":"healthcheck","version":"1.0"}}}')
            echo "attempt $i: HTTP $code"
            if [ "$code" = "200" ]; then
              head -c 300 /tmp/tunnel_init.txt; echo
              echo "TUNNEL HEALTHY"
              exit 0
            fi
            sleep 15
          done
          echo "::warning::tunnel probe did not return 200 within 225s — keep-alive still runs"
          tail -c 500 /tmp/tunnel_init.txt
          # do NOT exit 1 — keep-alive must run regardless

      - name: Keep alive (supervisor, ~5h45m)
        env:
          MCP_HOST_PORT: ${{ steps.port.outputs.port }}
        run: |
          # Every 60s, verify the two docker-compose services are up; if not,
          # bring them back. Every 5th minute, probe the local /healthz.
          for i in $(seq 1 345); do
            sleep 60

            # Verify both services exist (docker compose ps)
            if ! docker compose ps --services --status running 2>/dev/null | grep -qE '^(mcp|tunnel)$'; then
              echo "[tick $i] compose services not all running — restarting"
              docker compose up -d
            fi

            if [ $(( i % 5 )) -eq 0 ]; then
              code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 \
                "http://127.0.0.1:${MCP_HOST_PORT}/healthz")
              echo "[tick $i] local healthz: $code"
            fi
          done
          echo "shift complete — next runner should already be serving"

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-mcp-logs-run-${{ github.run_number }}
          path: |
            /tmp/abmcp-logs/
            *.log
          if-no-files-found: ignore

      - name: Tear down on exit
        if: always()
        run: |
          # capture logs before stopping
          docker compose logs --no-color > "/tmp/abmcp-logs/compose-final.log" 2>&1 || true
          docker compose down --remove-orphans || true
